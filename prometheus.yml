global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'visit-service'
    static_configs:
      - targets: ['visit-service:8001']
    metrics_path: '/metrics'

  - job_name: 'geo-service'
    static_configs:
      - targets: ['geo-service:8002']
    metrics_path: '/metrics'

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:8003']
    metrics_path: '/metrics'

  - job_name: 'stats-worker'
    static_configs:
      - targets: ['stats-worker:8001']
    metrics_path: '/metrics'

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:9419']