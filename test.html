<!DOCTYPE html>
<html>
<head>
    <title>Test API</title>
</head>
<body>
    <h1>Testing API</h1>
    <div id="result"></div>

    <script>
        async function testAPI() {
            try {
                const response = await fetch('http://localhost/api/v1/districts?bbox=37.4,55.7,37.8,55.9&level=district');
                const data = await response.json();
                document.getElementById('result').textContent = `Success: ${data.length} districts loaded`;
                console.log(data);
            } catch (error) {
                document.getElementById('result').textContent = `Error: ${error.message}`;
                console.error(error);
            }
        }

        testAPI();
    </script>
</body>
</html>
