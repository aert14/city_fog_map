events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        # Handle visit API requests
        location /api/v1/visit {
            proxy_pass http://visit-service:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Telegram-Init $http_x_telegram_init;
            proxy_set_header X-H3-Resolution $http_x_h3_resolution;
        }

        # Handle all other API requests and static files
        location / {
            proxy_pass http://monolith:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
