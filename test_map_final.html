<!DOCTYPE html>
<html>
<head>
    <title>City Fog Map - Test</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
    <link href="/webapp/style.css" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map-container { position: relative; width: 100%; height: 100vh; }
        #map { width: 100%; height: 100%; }
        #status { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 5px; z-index: 1000; }
    </style>
</head>
<body>
    <div id="map-container">
        <div id="map"></div>
        <div id="status">Initializing...</div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
    <script src="/webapp/fog.js"></script>
    <script type="module" src="/webapp/app.js"></script>
</body>
</html>
