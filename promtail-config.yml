server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 102400
    timeout: 10s
    backoff_config:
      min_period: 100ms
      max_period: 10s
      max_retries: 10

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'service_name'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(geo-service|visit-service|user-service|monolith|stats-worker|nginx|prometheus|grafana|loki|promtail|rabbitmq-exporter|rabbitmq|db|redis)'
        target_label: 'service'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        regex: '/(geo-service|visit-service|user-service|monolith)'
        target_label: 'service_type'
        replacement: 'api'
      - source_labels: ['__meta_docker_container_name']
        regex: '/stats-worker'
        target_label: 'service_type'
        replacement: 'worker'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(nginx|prometheus|grafana|loki|promtail|rabbitmq-exporter)'
        target_label: 'service_type'
        replacement: 'infrastructure'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(rabbitmq|db|redis)'
        target_label: 'service_type'
        replacement: 'storage'
    pipeline_stages:
      - json:
          expressions:
            asctime: asctime
            name: name
            levelname: levelname
            message: message
      - labels:
          service: service
          service_type: service_type
          level: levelname
      - template:
          source: message
          template: '{{ if .message }}{{ .message }}{{ else }}{{ .log }}{{ end }}'
      - drop:
          source: message
          expression: '^INFO:.*200 OK$'
      - drop:
          source: message
          expression: '^HTTP RES.*200.*ms$'
      - output:
          source: message