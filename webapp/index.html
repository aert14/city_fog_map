<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>City Fog Map</title>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #1a1a1a;
        --toolbar-bg: #2c2c2c;
        --primary-color: #f59e0b; /* Amber/Gold */
        --primary-hover: #d97706; /* Darker Amber */
        --text-primary: #f3f4f6;
        --text-secondary: #a1a1aa;
        --border-color: #404040;
      }
      html, body { 
        height: 100%; 
        margin: 0; 
        overflow: hidden;
        background-color: var(--bg-color);
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        color: var(--text-primary);
      }
      #app { 
        display: flex; 
        flex-direction: column; 
        height: 100%; 
      }
      #toolbar { 
        padding: 10px 14px;
        display: flex; 
        gap: 12px;
        align-items: center; 
        background-color: var(--toolbar-bg);
        border-bottom: 1px solid var(--border-color);
        z-index: 10;
        flex-shrink: 0;
      }
      
      #map-container {
        position: relative;
        flex: 1;
      }
      
      #map {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      #fog-canvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        pointer-events: none; 
      }

      .maplibregl-control-container {
        z-index: 3;
      }

      .btn {
        background-image: linear-gradient(to bottom, #f59e0b, #d97706);
        color: white;
        text-shadow: 0 1px 1px rgba(0,0,0,0.2);
        border: 1px solid #b45309;
        border-bottom-color: #92400e;
        padding: 8px 16px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.2);
      }
      .btn:hover:not(:disabled) {
        background-image: linear-gradient(to bottom, #fbbF19, #eab308);
        box-shadow: 0 3px 7px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.25);
        transform: translateY(-1px);
      }
      .btn:active:not(:disabled) {
        transform: translateY(0);
        box-shadow: 0 1px 2px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.1);
      }
      .btn:disabled {
        opacity: .6;
        cursor: not-allowed;
        background-image: linear-gradient(to bottom, #a1a1aa, #71717a);
        border-color: #52525b;
      }

      #status {
        font-size: 13px;
        color: var(--text-secondary);
      }
      .count-label {
        color: var(--text-secondary);
        font-size: 14px;
      }
      #count {
        font-weight: 700;
        color: var(--primary-color);
        margin-left: 2px;
      }

      #loader {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(26, 26, 26, 0.7);
        backdrop-filter: blur(4px);
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
      }
      .spinner {
        border: 4px solid rgba(245, 158, 11, 0.2);
        border-radius: 50%;
        border-top: 4px solid var(--primary-color);
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      #debugPanel {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-secondary);
        font-size: 13px;
      }
      #deleteModeBtn {
        background-image: linear-gradient(to bottom, #ef4444, #dc2626);
        border-color: #b91c1c;
        border-bottom-color: #991b1b;
      }
      #deleteModeBtn:hover:not(:disabled) {
        background-image: linear-gradient(to bottom, #f87171, #ef4444);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <button id="openBtn" class="btn">Открыть 50 м вокруг</button>
        <button id="toggleFogBtn" class="btn" style="display: none;">Скрыть туман</button>
        <span id="status"></span>
        <span class="count-label">Открыто: <span id="count">0</span></span>
        <div id="debugPanel" style="display: none;">
          <label for="radiusSlider">Радиус (м): <span id="radiusValue">50</span></label>
          <input id="radiusSlider" type="range" min="10" max="200" step="5" value="50" />
          <button id="deleteModeBtn" class="btn">Удаление: выкл</button>
          <button id="clearDbBtn" class="btn" title="Очистить все данные (dev)">Очистить БД</button>
        </div>
      </div>

      <div id="map-container">
        <div id="map"></div>
        <canvas id="fog-canvas"></canvas>
        <div id="loader"><div class="spinner"></div></div>
      </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
    <script src="/webapp/app.js"></script>
  </body>
</html>
