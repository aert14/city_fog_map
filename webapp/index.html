<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>City Fog Map</title>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="/webapp/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <button id="openBtn" class="btn">Explore 50m Around</button>
        <button id="toggleFogBtn" class="btn" style="display: none;">Hide Fog</button>
        <span id="status"></span>
        <span class="count-label">Explored: <span id="count">0</span></span>
        <div id="debugPanel" style="display: none;">
          <label for="radiusSlider">Radius (m): <span id="radiusValue">50</span></label>
          <input id="radiusSlider" type="range" min="10" max="200" step="5" value="50" />
          <button id="deleteModeBtn" class="btn">Delete: Off</button>
          <button id="clearDbBtn" class="btn" title="Clear all data (dev)">Clear DB</button>
        </div>
      </div>

      <div id="map-container">
        <div id="map"></div>
        <canvas id="fog-canvas"></canvas>
        <div id="loader"><div class="spinner"></div></div>
      </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
    <script src="/webapp/js/main.js" type="module"></script>
  </body>
</html>
