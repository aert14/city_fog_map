<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>City Fog Map</title>
    <link
      href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link href="/webapp/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <!-- Пользовательские элементы удалены -->
        <div id="mapControlsPanel">
          <button id="zoomInBtn" class="btn map-control-btn" title="Приблизить">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button id="zoomOutBtn" class="btn map-control-btn" title="Отдалить">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
          </button>
          <button id="geolocateBtn" class="btn map-control-btn" title="Определить гео и приблизить">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0-10 10c0 4.42 3.58 8 8 8s8-3.58 8-8a10 10 0 0 0-10-10z"/><path d="M12 12l4-4"/></svg>
          </button>
        </div>
        <div id="debugPanel" style="display: none">
          <!-- Кнопка "Fog" перенесена сюда -->
          <button id="toggleFogBtn" class="btn">Hide Fog</button>
          <button id="deleteModeBtn" class="btn">Delete: Off</button>
          <button id="selectionToggleBtn" class="btn">Select: On</button>
          <button id="revealDistrictBtn" class="btn">Reveal District</button>
          <button id="clearDbBtn" class="btn" title="Clear all data (dev)">
            Clear DB
          </button>
        </div>
      </div>

      <div id="map-container">
        <div id="map"></div>
        <canvas id="fog-canvas"></canvas>
        <!-- REMOVED: <div id="label-overlay"></div> -->
        <div id="loader"><div class="spinner"></div></div>
      </div>

      <div id="hud">
        <button id="hud-profile-btn" class="hud-btn">
          <!-- Иконка профиля -->
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </button>
        <div id="hud-count" class="hud-counter">0</div>
        <button id="hud-explore-btn" class="hud-btn main-action" disabled>
          <!-- SVG и span остаются без изменений -->
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0-10 10c0 4.42 3.58 8 8 8s8-3.58 8-8a10 10 0 0 0-10-10z"/><path d="M12 12l4-4"/></svg>
          <span>Исследовать</span>
        </button>
        <button id="hud-leaderboard-btn" class="hud-btn">
          <!-- SVG остается без изменений -->
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.5a3.5 3.5 0 0 0 4 0"/><path d="M8 22V7.5a2.5 2.5 0 0 1 2.5-2.5h3A2.5 2.5 0 0 1 16 7.5V22"/></svg>
        </button>
      </div>

      <div id="leaderboard-overlay" class="leaderboard-overlay">
        <div
          class="leaderboard-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="leaderboardTitle"
        >
          <div class="leaderboard-header">
            <h2 id="leaderboardTitle">Leaderboard</h2>
            <button
              id="leaderboardCloseBtn"
              class="btn btn-ghost"
              aria-label="Close leaderboard"
            >
              ✕
            </button>
          </div>
          <div class="leaderboard-controls">
            <label class="control">
              <span>Level</span>
              <select id="leaderboardLevel">
                <option value="district">District</option>
                <option value="okrug">Okrug</option>
              </select>
            </label>
            <label class="control">
              <span>Period</span>
              <select id="leaderboardPeriod">
                <option value="week">Week</option>
                <option value="season">Season</option>
              </select>
            </label>
          </div>
          <div id="leaderboardStatus" class="leaderboard-status"></div>
          <div class="leaderboard-table-wrapper">
            <table class="leaderboard-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Player</th>
                  <th>Cells</th>
                  <th>Weight</th>
                  <th>% Cells</th>
                  <th>% Weight</th>
                </tr>
              </thead>
              <tbody id="leaderboardBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="profile-overlay" class="profile-overlay" style="display: none;">
        <div class="profile-panel">
          <div class="profile-header">
            <h2>Профиль и Достижения</h2>
            <button id="profile-close-btn" class="btn btn-ghost">✕</button>
          </div>
          <div id="profile-content" class="profile-content">
            <h3>Ваши достижения</h3>
            <div id="achievements-list" class="achievements-list">
              <!-- Сюда будут загружаться ачивки -->
              <div class="loader-sm"></div> <!-- Спиннер загрузки -->
            </div>
          </div>
        </div>
      </div>

      <div id="onboarding-overlay" class="onboarding-overlay" style="display: none;">
        <div class="onboarding-modal">
          <h3 id="onboarding-title"></h3>
          <p id="onboarding-text"></p>
          <div class="onboarding-actions">
            <button id="onboarding-skip-btn">Пропустить</button>
            <button id="onboarding-next-btn">Далее</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
    <script src="/webapp/fog.js"></script>
    <script type="module" src="/webapp/app.js"></script>
  </body>
</html>
